name: Backfill Rainfall Data (one-time)

on:
  workflow_dispatch: # Manual trigger only

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip requests pytz

      - name: Run backfill
        env:
          TEMPEST_API_TOKEN:  ${{ secrets.TEMPEST_API_TOKEN }}
          TEMPEST_STATION_ID: ${{ secrets.TEMPEST_STATION_ID }}
        run: python backfill.py

      - name: Commit & push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_rainfall.csv
          git diff --cached --quiet || git commit -m "chore: backfill rainfall data 2025-10-03 to 2026-04-01"
          git pull --rebase origin main
          git push
